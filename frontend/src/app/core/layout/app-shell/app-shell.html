<mat-toolbar class="toolbar">
  @if (compact()) {
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="texts.toggleNavigation"
      [attr.aria-expanded]="drawer.opened"
      (click)="drawer.toggle()"
    >
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
  }

  <span class="brand">
    <span class="brand-mark" aria-hidden="true"><mat-icon>event_available</mat-icon></span>
    <span>{{ texts.appName }}</span>
  </span>

  <span class="spacer"></span>

  @if (auth.currentUser(); as user) {
    <span class="user">
      <span class="user-name">{{ user.firstName }} {{ user.lastName }}</span>
      <span class="user-role">{{ texts.roles[user.role] }}</span>
    </span>
  }

  <button mat-button type="button" (click)="signOut()">
    <mat-icon aria-hidden="true">logout</mat-icon>
    {{ texts.signOut }}
  </button>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #drawer class="sidenav" [mode]="compact() ? 'over' : 'side'" [opened]="!compact()">
    <nav [attr.aria-label]="texts.mainNavigation">
      <mat-nav-list>
        @for (item of navItems(); track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            #link="routerLinkActive"
            ariaCurrentWhenActive="page"
            [activated]="link.isActive"
            (click)="onNavigate()"
          >
            <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
